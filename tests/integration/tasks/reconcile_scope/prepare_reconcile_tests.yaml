---
# Prepare reconcile fixtures before play-level filetree_create / filetree_reconcile roles.

- name: Reconcile | organizations CaC out of scope does not create present entries
  when: __integration_out_of_scope_org | default('') | length > 0
  tags:
    - reconcile
    - reconcile_cac_out_of_scope
  block:
    - name: Reconcile CaC out of scope | Reset organization export filters
      ansible.builtin.set_fact:
        __integration_export_filters: >-
          {{
            __integration_export_filters_baseline
            | combine({'organizations': [__integration_filter_org]}, recursive=True)
          }}
        __integration_reconcile_scope_filters: "{{ __integration_export_filters }}"
        __integration_reconcile_apply_scope_filters: true

- name: Reconcile | live out of scope does not create absent entries
  when: __integration_out_of_scope_org | default('') | length > 0
  tags:
    - reconcile
    - reconcile_live_out_of_scope
  block:
    - name: Reconcile live out of scope | Prepare scope filters
      ansible.builtin.set_fact:
        __integration_reconcile_scope_filters: >-
          {{
            __integration_export_filters_baseline
            | combine({'organizations': [__integration_filter_org]}, recursive=True)
          }}
        __integration_reconcile_apply_scope_filters: true

- name: Reconcile | unscoped compare reports out-of-scope CaC as present
  when: __integration_out_of_scope_org | default('') | length > 0
  tags:
    - reconcile
    - reconcile_unscoped_legacy
  block:
    - name: Reconcile unscoped legacy | Disable scope filters for compare
      ansible.builtin.set_fact:
        __integration_reconcile_apply_scope_filters: false

- name: Reconcile | domains scope ignores out-of-scope CaC domain
  when:
    - __integration_filter_domain_name | default('') | length > 0
    - __integration_exclude_domain_name | default('') | length > 0
  tags:
    - reconcile
    - reconcile_domains_scope
  block:
    - name: Reconcile domains scope | Reset domain export filters
      ansible.builtin.set_fact:
        __integration_export_filters: >-
          {{
            __integration_export_filters_baseline
            | combine({'name_include': [__integration_filter_domain_name]}, recursive=True)
          }}
        __integration_reconcile_scope_filters: "{{ __integration_export_filters }}"
        __integration_reconcile_apply_scope_filters: true

...
