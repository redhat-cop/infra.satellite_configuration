---
# Per-filter live Satellite export tests. Each case needs CLI --tags, for example:
#   --tags always,filter_organizations,organizations,yaml_format
# Use tests/integration/run_integration_tests.sh filters for the full suite.

- name: Filter organizations | Run export scope test
  when: __integration_filter_org | default('') | length > 0
  tags:
    - filter
    - filter_organizations
  block:
    - name: Filter organizations | Reset working filters
      ansible.builtin.include_tasks: reset_filters.yaml

    - name: Filter organizations | Apply allow-list
      ansible.builtin.set_fact:
        __integration_export_filters: >-
          {{
            __integration_export_filters
            | combine({'organizations': [__integration_filter_org]}, recursive=True)
          }}

