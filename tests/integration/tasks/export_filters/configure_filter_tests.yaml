- name: Filter labels | Resolve repository label fixture
  ansible.builtin.set_fact:
    __integration_filter_label_name: >-
      {{
        (
          __integration_repositories_api_clean
          | selectattr('label', 'defined')
          | rejectattr('label', 'equalto', '')
          | map(attribute='label')
          | list
          | first
        )
        | default(
            (
              __integration_repositories_api_clean
              | selectattr('content_label', 'defined')
              | rejectattr('content_label', 'equalto', '')
              | map(attribute='content_label')
              | list
              | first
            ),
            true
          )
      }}
  tags:
    - filter
    - filter_labels

- name: Filter labels | Run export scope test
  when: __integration_filter_label_name | default('') | length > 0
  tags:
    - filter
    - filter_labels
