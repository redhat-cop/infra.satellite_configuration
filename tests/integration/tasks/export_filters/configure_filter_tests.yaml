      ansible.builtin.set_fact:
        __integration_export_filters: >-
          {{
            __integration_export_filters
            | combine(
                {
                  'organizations': [__integration_filter_org],
                  'repository_sets_only_enabled': true,
                },
                recursive=True
              )
          }}
        __integration_repository_sets_expected_enabled_count: >-
          {{
            __integration_repository_sets_api.json.results
            | default([])
            | selectattr('enabled', 'defined')
            | selectattr('enabled')
            | list
            | length
          }}

