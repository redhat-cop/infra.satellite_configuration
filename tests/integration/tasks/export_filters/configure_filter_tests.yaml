- name: Filter labels_exclude | Resolve repository label fixture for exclude
  ansible.builtin.set_fact:
    __integration_exclude_label_name: >-
      {{
        (
          __integration_repositories_api_clean
          | selectattr('label', 'defined')
          | map(attribute='label')
          | reject('equalto', __integration_filter_label_name | default(''))
          | reject('equalto', '')
          | list
          | first
        )
        | default(
            (
              __integration_repositories_api_clean
              | selectattr('content_label', 'defined')
              | map(attribute='content_label')
              | reject('equalto', __integration_filter_label_name | default(''))
              | reject('equalto', '')
              | list
              | first
            ),
            true
          )
      }}
  tags:
    - filter
    - filter_labels_exclude

