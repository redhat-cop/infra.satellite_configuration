---
# Test playbook helper tasks (not the role under test). Tag always for CLI --tags runs.

- name: Query organizations on Satellite
  tags: [always]
  ansible.builtin.uri:
    method: GET
    url: "{{ satellite.server_url }}/api/organizations?per_page=all"
    user: "{{ satellite.admin.username }}"
    password: "{{ satellite.admin.password }}"
    validate_certs: "{{ satellite.validate_certs }}"
    force_basic_auth: true
    return_content: true
    timeout: 1200
  register: __integration_organizations_api

