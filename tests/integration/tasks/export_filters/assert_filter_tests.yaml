---
# Assert filter export results for the active filter_<test> case.

- name: Filter organizations | Run export scope test
  when: __integration_filter_org | default('') | length > 0
  tags:
    - filter
    - filter_organizations
  block:
    - name: Filter organizations | Assert export
      ansible.builtin.include_tasks: assert_export_subset.yaml
      vars:
        __efa_var_name: satellite_organizations
        __efc_role_tag: organizations
        __efa_api_results: "{{ __integration_organizations_api.json.results | default([]) }}"
        __efa_filters: "{{ __integration_export_filters }}"
        __efa_filter_mode: organizations
        __efa_assert_label: organizations

