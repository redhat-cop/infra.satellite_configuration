- name: Filter roles_include_builtin | Run export scope test
  tags:
    - filter
    - filter_roles_include_builtin
  block:
    - name: Filter roles_include_builtin | Assert export file exists after opt-in
      ansible.builtin.stat:
        path: "{{ satellite_configuration_filetree_path }}/satellite_roles.d/satellite_roles.yaml"
      register: __integration_roles_builtin_export_stat

    - name: Filter roles_include_builtin | Assert built-in opt-in export completed
      ansible.builtin.assert:
        that:
          - __integration_roles_builtin_export_stat.stat.exists | default(false) | bool
        fail_msg: Role export with roles_include_builtin did not produce satellite_roles.yaml.

- name: Filter roles_include_locked | Run export scope test
  tags:
    - filter
    - filter_roles_include_locked
  block:
    - name: Filter roles_include_locked | Assert export file exists
      ansible.builtin.stat:
        path: "{{ satellite_configuration_filetree_path }}/satellite_roles.d/satellite_roles.yaml"
      register: __integration_roles_locked_export_stat

    - name: Filter roles_include_locked | Assert export completed
      ansible.builtin.assert:
        that:
          - __integration_roles_locked_export_stat.stat.exists | default(false) | bool
        fail_msg: Role export with roles_include_locked did not produce satellite_roles.yaml.

