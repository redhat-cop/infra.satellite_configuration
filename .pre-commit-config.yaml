---
repos:
  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: "https://github.com/ansible/ansible-lint.git"
    rev: v26.8.0
    hooks:
      # see discussions here about what arguments are used, and behavior
      # https://github.com/ansible/ansible-lint/issues/649
      # Roles will trigger an "unknown file type"
      # https://github.com/ansible/ansible-lint/issues/808
      - id: ansible-lint
        pass_filenames: false
        always_run: true
        # entry: "python3 -m ansiblelint -v --force-color"
        entry: "ansible-lint"
        language: python
        language_version: python3.14
        args:
          - "--profile=production"
        # additional_dependencies:
        #   - "ansible-core>=2.16.14"
        #   - "yamllint>=1.26,<2.0"
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  - repo: local
    hooks:
      - id: unit-tests
        name: unit-tests
        entry: pytest -q tests/unit
        language: python
        additional_dependencies:
          - pytest
          - ansible-core==2.21.3
          - PyYAML
        pass_filenames: false
        always_run: true
      - id: collection-python-sanity
        name: collection python sanity
        entry: python .github/scripts/check_collection_python.py
        language: python
        additional_dependencies:
          - ansible-core==2.21.3
          - PyYAML
        pass_filenames: false
        always_run: true
      - id: galaxy-import
        name: galaxy-import
        entry: python .github/scripts/check_galaxy_import.py
        language: python
        additional_dependencies:
          - ansible-core==2.21.3
          - galaxy-importer==0.4.40
          - ansible-lint==26.6.0
          - PyYAML
        pass_filenames: false
        always_run: true
  - repo: https://github.com/ambv/black
    rev: 26.5.1
    hooks:
      - id: black
        name: black
        entry: black
        args: [--config=.black.cfg, --check, --diff]
        files: ^(plugins|tests/unit)/.*\.py$
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: flake8
        entry: flake8
        types: [python]
  - repo: https://github.com/pycqa/pylint
    rev: v4.0.8
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        pass_filenames: false
        always_run: true
        args: [plugins, tests/unit]
        additional_dependencies:
          - ansible-core==2.21.3
          - PyYAML
...
