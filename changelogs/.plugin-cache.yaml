    satellite_configuration_sanitize_partition_table_layout:
      description: Prepare partition table layout for Satellite import
      name: satellite_configuration_sanitize_partition_table_layout
      version_added: 1.2.0
    satellite_configuration_unwrap_raw_markers:
      description: Strip CaC export {% raw %} / {% endraw %} wrappers
      name: satellite_configuration_unwrap_raw_markers
