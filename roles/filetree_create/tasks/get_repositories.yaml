---
- name: Repositories | Reset the results variable
  ansible.builtin.set_fact:
    result_api_response: {}

- name: Repositories | Get Basic Info
  ansible.builtin.include_tasks: api_call.yaml
  vars:
    call_type: Repositories
    api_link: >-
      {{
        '/katello/api/repositories?full_result=true'
        | infra.satellite_configuration.satellite_configuration_append_export_search_for_resource(
            satellite_configuration_filetree_create_filters,
            'repositories'
          )
      }}

- name: Repositories | Create a List
  ansible.builtin.set_fact:
    all_results: >-
      {{
        result_api_response.json.results
        | rejectattr('url', 'search', satellite_redhat_repository_url_substring)
        | infra.satellite_configuration.satellite_configuration_reject_orphaned_katello_products
        | infra.satellite_configuration.satellite_configuration_filter_export_items(
            satellite_configuration_filetree_create_filters
            | infra.satellite_configuration.satellite_configuration_filters_for_post_api_export(
                'repositories'
              )
          )
        | sort(attribute='id')
        | list
      }}

- name: Repositories | Get Detailed Info
  ansible.builtin.include_tasks: detailed_api_call.yaml
  vars:
    call_type: Repositories
    api_link: /katello/api/repositories/
    loop_var: "{{ all_results }}"

- name: Repositories | No repositories to detail
  when: all_results | length == 0
  ansible.builtin.set_fact:
    detailed_info:
      results: []

- name: Repositories | Template Out Results
  when:
    - detailed_info is defined
    - detailed_info.results is defined
    - detailed_info.results | length > 0
  ansible.builtin.include_tasks: template_out.yaml
  vars:
    template_type: satellite_repositories
...
