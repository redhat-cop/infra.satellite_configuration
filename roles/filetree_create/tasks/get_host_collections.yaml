---
- name: Host Collections | Reset the results variable
  ansible.builtin.set_fact:
    result_api_response: {}
    __host_collections_info_list: []

- name: Host Collections | Get Organizations
  ansible.builtin.include_tasks: resolve_export_organizations.yaml
  vars:
    __export_org_call_type: Host Collections

- name: Host Collections | Fetch host collections per organization
  ansible.builtin.include_tasks: get_host_collections_do_work.yaml
  loop: >-
    {{
      __result_organizations.organizations
      | infra.satellite_configuration.satellite_configuration_filter_export_organizations(
          satellite_configuration_filetree_create_filters
        )
    }}
  loop_control:
    loop_var: __current_org
    label: "{{ __current_org.name }}"

- name: Host Collections | Set Info List
  ansible.builtin.set_fact:
    info_list: >-
      {{
        __host_collections_info_list | default([])
        | infra.satellite_configuration.satellite_configuration_filter_export_items(
            satellite_configuration_filetree_create_filters
            | infra.satellite_configuration.satellite_configuration_filters_for_post_api_export(
                'host_collections'
              )
          )
        | sort(attribute='id')
      }}

- name: Host Collections | Template Out Results
  when:
    - info_list is defined
    - info_list | length > 0
  ansible.builtin.include_tasks: template_out.yaml
  vars:
    template_type: satellite_host_collections

...
