---
- name: Operating Systems | Reset the results variable
  ansible.builtin.set_fact:
    result_api_response: {}
    __rs_info_list: []

- name: Operating Systems | Get Operating Systems
  ansible.builtin.include_tasks: api_call.yaml
  vars:
    call_type: Operating Systems
    api_link: "/api/operatingsystems?per_page=all"

- name: Operating Systems | Lookup Satellite host operating system for optional exclusion
  when: filetree_create_skip_satellite_host_operatingsystem | default(false) | bool
  ansible.builtin.uri:
    method: GET
    url: >-
      {{ satellite.server_url }}/api/hosts?per_page=1&search={{
        ('name = ' ~ (satellite.server_url | urlsplit('hostname'))) | urlencode
      }}
    user: "{{ satellite.admin.username }}"
    password: "{{ satellite.admin.password }}"
    validate_certs: "{{ satellite.validate_certs }}"
    force_basic_auth: true
    return_content: true
    timeout: 1200
  register: __satellite_host_operatingsystem_lookup

- name: Operating Systems | Retain Satellite host operating system id for exclusion
  when:
    - filetree_create_skip_satellite_host_operatingsystem | default(false) | bool
    - __satellite_host_operatingsystem_lookup.json.results | default([]) | length > 0
    - __satellite_host_operatingsystem_lookup.json.results[0].operatingsystem_id is defined
  ansible.builtin.set_fact:
    __satellite_host_operatingsystem_id: "{{ __satellite_host_operatingsystem_lookup.json.results[0].operatingsystem_id }}"
    __satellite_host_operatingsystem_name: >-
      {{
        __satellite_host_operatingsystem_lookup.json.results[0].operatingsystem_name
        | default(__satellite_host_operatingsystem_lookup.json.results[0].display_name | default('unknown'))
      }}

- name: Operating Systems | Report Satellite host operating system omitted from export
  ansible.builtin.debug:
    msg: >-
      Omitted Satellite host operating system {{ __satellite_host_operatingsystem_name }}
      (id {{ __satellite_host_operatingsystem_id }}) from export.
  when:
    - filetree_create_skip_satellite_host_operatingsystem | default(false) | bool
    - __satellite_host_operatingsystem_id is defined

- name: Operating Systems | Retain the Operating Systems' info
  ansible.builtin.set_fact:
    __operatingsystems_list: >-
      {{
        result_api_response.json.results
        | rejectattr('id', 'equalto', __satellite_host_operatingsystem_id)
        | list
        if (
          (filetree_create_skip_satellite_host_operatingsystem | default(false) | bool)
          and (__satellite_host_operatingsystem_id is defined)
        )
        else result_api_response.json.results
      }}

- name: Operating Systems | Get External Operating Systems Info
  ansible.builtin.include_tasks: get_operatingsystems_do_work.yaml
  loop: "{{ __operatingsystems_list }}"
  loop_control:
    loop_var: __current_operatingsystem

- name: Operating Systems | Record hidden parameters for vault template
  ansible.builtin.include_tasks: record_hidden_parameters_for_vault.yaml
  vars:
    __record_hidden_results: "{{ __rs_info_list | default([]) }}"
    __record_hidden_vault_fact: satellite_configuration_vault_template_operatingsystem_parameters
    __record_hidden_entity_label: operating system
    __record_hidden_entity_key_format: operatingsystem_flat

- name: Operating Systems | Template Out Results
  when:
    - __rs_info_list is defined
    - __rs_info_list | length > 0
  ansible.builtin.include_tasks: template_out.yaml
  vars:
    template_type: satellite_operatingsystems
    info_list: "{{ __rs_info_list | default([]) }}"
...
