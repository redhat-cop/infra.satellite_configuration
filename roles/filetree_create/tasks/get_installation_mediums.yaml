---
- name: Installation Mediums | Reset the results variable
  ansible.builtin.set_fact:
    result_api_response: {}
    __rs_info_list: []

- name: Installation Mediums | Get Installation Mediums
  ansible.builtin.include_tasks: api_call.yaml
  vars:
    call_type: Installation Mediums
    api_link: "/api/media?per_page=all"

- name: Installation Mediums | Resolve locked installation medium export skip flag
  ansible.builtin.set_fact:
    __filetree_create_effective_skip_locked_installation_mediums: >-
      {{
        false
        if (filetree_create_include_locked_templates | default(false) | bool)
        else (filetree_create_skip_locked_installation_mediums | default(true) | bool)
      }}

- name: Installation Mediums | Filter locked installation media from export index
  ansible.builtin.include_tasks: filter_locked_export_index.yaml
  vars:
    __filter_locked_source_list: "{{ result_api_response.json.results }}"
    __filter_locked_skip: "{{ __filetree_create_effective_skip_locked_installation_mediums }}"
    __filter_locked_call_type: Installation Mediums
    __filter_locked_object_label: installation media

- name: Installation Mediums | Retain the Installation Mediums' info
  ansible.builtin.set_fact:
    __installation_mediums_list: "{{ __filter_locked_export_list }}"

- name: Installation Mediums | Get External Installation Mediums Info
  ansible.builtin.include_tasks: get_installation_mediums_do_work.yaml
  loop: "{{ __installation_mediums_list }}"
  loop_control:
    loop_var: __current_installation_medium

- name: Installation Mediums | Flag vault FQDN when paths reference source hostnames
  ansible.builtin.set_fact:
    satellite_configuration_vault_template_installation_mediums_fqdn: true
  loop: "{{ (satellite_configuration_export_path_hostnames | default([])) + (satellite_configuration_export_source_aliases | default([])) }}"
  loop_control:
    loop_var: __export_hostname
  when:
    - __export_hostname | length > 0
    - __rs_info_list | default([]) | map(attribute='path') | map('string') | select('search', __export_hostname | regex_escape) | list | length > 0

- name: Installation Mediums | Template Out Results
  when:
    - __rs_info_list is defined
    - __rs_info_list | length > 0
  ansible.builtin.include_tasks: template_out.yaml
  vars:
    template_type: satellite_installation_mediums
    info_list: "{{ __rs_info_list | default([]) }}"
...
